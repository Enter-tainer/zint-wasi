name: CD

# Cuts a release on demand: moves the version where the repository repeats
# it, builds the package, commits and tags the result, publishes a GitHub
# release with the package and the manual attached, and opens the pull
# request that puts the version on Typst Universe.
#
# The run stops before it changes anything if the version is already tagged
# here or already published on Universe, so re-running a failed release is
# safe as long as it did not get as far as pushing the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as major.minor.patch. Empty releases the version the manifests already carry."
        required: false
        type: string
      publish:
        description: "Open the pull request on typst/packages"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Build and upload the release assets only: no commit, tag, release or pull request"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# A release must never be cancelled halfway through; a second one waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  XTASK_WASI_SDK_VERSION: 34
  XTASK_BINARYEN_VERSION: 132
  XTASK_TYPST_VERSION: 0.15.1
  XTASK_WASI_STUB_VERSION: 0.3.1
  XTASK_WORK_DIR: ./ci_work_dir
  # The name under which the package is published, which is also the name
  # of the Universe fork's branch and the release assets.
  PACKAGE_NAME: tiaoma

jobs:
  # Ubuntu only, for the same reason as the CI plugin job: wasi-stub cannot
  # write its output on Windows.
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from a side branch
        if: ${{ !inputs.dry_run && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::Releases are cut from ${{ github.event.repository.default_branch }}, and this run was started on ${{ github.ref_name }}. Use a dry run to try the workflow on a branch."
          exit 1
      # Checked before anything is built or pushed, so a missing token does
      # not leave a tag behind that the next attempt trips over.
      - name: Refuse to publish without a token
        if: ${{ !inputs.dry_run && inputs.publish }}
        env:
          TYPST_PACKAGES_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TYPST_PACKAGES_TOKEN" ]; then
            echo "::error::The TYPST_PACKAGES_TOKEN secret is not set. Add a personal access token that may push to a fork of typst/packages, or start the run with 'publish' unchecked."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: true
          # The tags are needed to see whether the version was released before.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      # The same keys as the CI plugin job, so the tools it already fetched
      # for master are reused here.
      - name: Cache WASI SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/wasi_sdk
          key: tools-wasi-sdk-${{ env.XTASK_WASI_SDK_VERSION }}
      - name: Cache wasi-stub
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasi-stub
          key: tools-wasi-stub-${{ env.XTASK_WASI_STUB_VERSION }}
      - name: Cache wasm-opt
        uses: actions/cache@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/tools/wasm-opt
          key: tools-binaryen-${{ env.XTASK_BINARYEN_VERSION }}
      - name: Cache typst
        uses: actions/cache@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/tools/typst
          key: tools-typst-${{ env.XTASK_TYPST_VERSION }}

      - name: Set the version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: cargo xtask set-version "$VERSION"
      - name: Read the version
        id: version
        run: |
          version=$(cargo xtask version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $PACKAGE_NAME $version"

      - name: Refuse a version that was released before
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Pass a new version to release, or delete the tag if that release never happened."
            exit 1
          fi
          # Only a 404 proves the version is not on Universe; any other answer
          # means the check could not be made, which is not the same thing.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/typst/packages/contents/packages/preview/$PACKAGE_NAME/$VERSION")
          case "$status" in
            404) ;;
            200) echo "::error::$PACKAGE_NAME $VERSION is already published on Typst Universe."; exit 1 ;;
            *) echo "::error::Could not check Typst Universe for $PACKAGE_NAME $VERSION (HTTP $status)."; exit 1 ;;
          esac

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Build the package
        run: cargo xtask bundle

      - name: Assemble the release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          # The zip unpacks to <name>/<version>, which is the layout of a local
          # package directory, so it can be dropped into one as it is.
          (cd "$XTASK_WORK_DIR/bundle" && zip -r "$GITHUB_WORKSPACE/release/$PACKAGE_NAME-$VERSION.zip" "$PACKAGE_NAME/$VERSION")
          cp typst-package/manual.pdf "release/$PACKAGE_NAME-$VERSION-manual.pdf"
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release/
          retention-days: 30

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only tracked files: the version bump, the refreshed lock file and
          # xtask state, and the manual as it was compiled for this release.
          git add --update
          if git diff --cached --quiet; then
            echo "Nothing to commit; tagging the current commit."
          else
            git status --short
            git commit --message "chore: release $VERSION"
          fi
          git tag --annotate "$TAG" --message "$PACKAGE_NAME $VERSION"
          # One update or none: two refspecs are pushed independently, so a
          # branch update rejected because master moved would otherwise leave
          # the tag behind, and every retry refused by the check above.
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "$TAG"

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<EOF
          \`\`\`typ
          #import "@preview/$PACKAGE_NAME:$VERSION"
          \`\`\`

          The import works once the Typst Universe pull request for this version has been merged. Until then, or to use the package offline, unpack \`$PACKAGE_NAME-$VERSION.zip\` into the \`local\` namespace of your [package directory](https://github.com/typst/packages#local-packages) and import \`@local/$PACKAGE_NAME:$VERSION\`. The manual is attached separately, as it is not part of the package.

          EOF
          gh release create "$TAG" \
            --verify-tag \
            --title "$PACKAGE_NAME $VERSION" \
            --notes-file release-notes.md \
            --generate-notes \
            release/*

      # Universe takes submissions as pull requests only, from a fork of
      # typst/packages, so this needs a token of a person: the default token
      # cannot push to another repository. Everything under typst-package is
      # committed, including what typst.toml excludes; Universe leaves those
      # files out of the bundle itself and links them from the package page.
      - name: Open the Typst Universe pull request
        if: ${{ !inputs.dry_run && inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          owner=$(gh api user --jq .login)
          owner_id=$(gh api user --jq .id)
          owner_name=$(gh api user --jq '.name // .login')
          branch="$PACKAGE_NAME-$VERSION"
          destination="packages/preview/$PACKAGE_NAME/$VERSION"

          # The fork is created if the person has none, and brought up to date
          # otherwise, so the branch below starts from the current main.
          gh repo fork typst/packages --clone=false
          gh repo sync "$owner/packages" --source typst/packages --branch main

          # typst/packages holds every package ever published, so only the
          # trees are fetched and only this package's directory is checked out.
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:$GH_TOKEN@github.com/$owner/packages.git" universe
          cd universe
          git sparse-checkout set "packages/preview/$PACKAGE_NAME"
          git config user.name "$owner_name"
          git config user.email "$owner_id+$owner@users.noreply.github.com"
          git checkout -b "$branch"
          mkdir -p "$destination"
          cp -r ../typst-package/. "$destination"
          git add "$destination"
          git commit --message "$PACKAGE_NAME:$VERSION"
          git push origin "$branch"

          cat > ../universe-pr.md <<EOF
          I am submitting
          - [ ] a new package
          - [x] an update for a package

          Description: Barcode and QR code generator for Typst, built on Zint. This release is described in ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG.
          EOF
          gh pr create \
            --repo typst/packages \
            --head "$owner:$branch" \
            --title "$PACKAGE_NAME:$VERSION" \
            --body-file ../universe-pr.md

      - name: Summarise
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## $PACKAGE_NAME $VERSION"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run: the assets are attached to this workflow run; nothing was committed, tagged, released or published."
            else
              echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
              if [ "${{ inputs.publish }}" = "true" ]; then
                echo "- Typst Universe: see the pull request titled \`$PACKAGE_NAME:$VERSION\` on https://github.com/typst/packages/pulls"
              else
                echo "- Typst Universe: not submitted; run again with 'publish' checked, or submit the package directory by hand."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
