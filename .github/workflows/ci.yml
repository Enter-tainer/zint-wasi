name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # Advisories are published against dependencies that never change, so the
  # audit needs a trigger that isn't tied to a commit.
  schedule:
    - cron: "21 6 * * 1"

permissions:
  contents: read

# Only the latest push to a branch is worth a runner. The event is part of the
# group so the weekly run and a push to master don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XTASK_WASI_SDK_VERSION: 24
  XTASK_BINARYEN_VERSION: 119
  XTASK_TYPST_VERSION: 0.13.1
  XTASK_WORK_DIR: ./ci_work_dir

jobs:
  lint:
    name: Lint
    # The weekly run exists for the audit; nothing else here changes on its own.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
            components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
            save-if: ${{ github.ref == 'refs/heads/master' }}
      # The crates are listed explicitly because the workspace also contains
      # vendored third-party code that is not ours to format or lint.
      - name: Check formatting
        run: cargo fmt --check -p zint-wasm-sys -p zint-wasm-rs -p zint-typst-plugin -p xtask
      - name: Check lints
        run: cargo clippy --locked --all-targets -p zint-wasm-sys -p zint-wasm-rs -p zint-typst-plugin -p xtask -- -D warnings

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
            save-if: ${{ github.ref == 'refs/heads/master' }}
      # Same crate list as the lint job: the workspace also contains vendored
      # third-party code, which is not ours to test.
      - name: Run tests
        run: cargo test --locked -p zint-wasm-sys -p zint-wasm-rs -p zint-typst-plugin -p xtask

  audit:
    name: Audit
    # A newly published advisory is not a contributor's doing, so it must never
    # block their pull request. It reports on master and on the weekly run,
    # where it is the maintainer's to triage.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Only Cargo.lock is read, so the submodules are not needed here.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
            save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check advisories
        run: cargo audit

  plugin:
    name: Build Typst Plugin
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
            targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
            save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Restore WASI SDK
        id: restore-wasi-sdk
        uses: actions/cache/restore@v6
        with:
          path: ci_work_dir/wasi_sdk
          key: tools-wasi-sdk-${{ env.XTASK_WASI_SDK_VERSION }}
      - name: Restore wasi-stub
        id: restore-wasi-stub
        uses: actions/cache/restore@v6
        with:
          path: |
            zint-typst-plugin/vendor/wasm-minimal-protocol/target/release/wasi-stub
            zint-typst-plugin/vendor/wasm-minimal-protocol/target/debug/wasi-stub
          key: tools-wasi-stub-${{ hashFiles('zint-typst-plugin/vendor/wasm-minimal-protocol/crates/wasi-stub/**') }}
      - name: Restore wasm-opt
        id: restore-wasm-opt
        uses: actions/cache/restore@v6
        with:
          path: ci_work_dir/tools/wasm-opt
          key: tools-binaryen-${{ env.XTASK_BINARYEN_VERSION }}
      - name: Restore typst
        id: restore-typst
        uses: actions/cache/restore@v6
        with:
          path: ci_work_dir/tools/typst
          key: tools-typst-${{ env.XTASK_TYPST_VERSION }}
      - name: Run CI xtask
        run: cargo xtask ci
      # Saving on failure keeps a build error from throwing away tools that were
      # already downloaded, but a cancelled run is skipped: it can interrupt an
      # unpacking tool and the keys are too coarse to notice a truncated one.
      - name: Cache WASI SDK
        if: ${{ !cancelled() && steps.restore-wasi-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ci_work_dir/wasi_sdk
          key: tools-wasi-sdk-${{ env.XTASK_WASI_SDK_VERSION }}
      - name: Cache wasi-stub
        if: ${{ !cancelled() && steps.restore-wasi-stub.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            zint-typst-plugin/vendor/wasm-minimal-protocol/target/release/wasi-stub
            zint-typst-plugin/vendor/wasm-minimal-protocol/target/debug/wasi-stub
          key: tools-wasi-stub-${{ hashFiles('zint-typst-plugin/vendor/wasm-minimal-protocol/crates/wasi-stub/**') }}
      - name: Cache wasm-opt
        if: ${{ !cancelled() && steps.restore-wasm-opt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ci_work_dir/tools/wasm-opt
          key: tools-binaryen-${{ env.XTASK_BINARYEN_VERSION }}
      - name: Cache typst
        if: ${{ !cancelled() && steps.restore-typst.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ci_work_dir/tools/typst
          key: tools-typst-${{ env.XTASK_TYPST_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-wasm
          path: ./typst-package/zint_typst_plugin.wasm
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: manual
          path: ./typst-package/manual.pdf
          retention-days: 7
