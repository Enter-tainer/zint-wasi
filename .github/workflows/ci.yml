name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # Advisories are published against dependencies that never change, so the
  # audit needs a trigger that isn't tied to a commit.
  schedule:
    - cron: "21 6 * * 1"

permissions:
  contents: read

# Only the latest push to a branch is worth a runner. The event is part of the
# group so the weekly run and a push to master don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XTASK_WASI_SDK_VERSION: 34
  XTASK_BINARYEN_VERSION: 132
  XTASK_TYPST_VERSION: 0.15.1
  XTASK_WASI_STUB_VERSION: 0.3.1
  XTASK_WORK_DIR: ./ci_work_dir

jobs:
  lint:
    name: Lint
    # The weekly run exists for the audit; nothing else here changes on its own.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      # A lint that only fires on one platform is the interesting one, so let
      # the other runner finish and report it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
            components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
            save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Point bindgen at libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=$env:ProgramFiles/LLVM/bin" >> $env:GITHUB_ENV
      - name: Check formatting
        run: cargo fmt --check --all
      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
            save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Point bindgen at libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=$env:ProgramFiles/LLVM/bin" >> $env:GITHUB_ENV
      - name: Run tests
        run: cargo test --locked --workspace
      # Building the library next to the plugin turns on its `typst` feature,
      # which renames every option key, so the plain library needs a run of its
      # own to be covered at all.
      - name: Run tests without the Typst option names
        run: cargo test --locked -p zint-wasm-rs

  audit:
    name: Audit
    # A newly published advisory is not a contributor's doing, so it must never
    # block their pull request. It reports on master and on the weekly run,
    # where it is the maintainer's to triage.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Only Cargo.lock is read, so the submodules are not needed here.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
            save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check advisories
        run: cargo audit

  # One runner is enough to produce the artifact; the lint and test jobs above
  # cover xtask on the other platform.
  plugin:
    name: Build Typst Plugin
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
            targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
            save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Restore WASI SDK
        id: restore-wasi-sdk
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/wasi_sdk
          key: tools-wasi-sdk-${{ env.XTASK_WASI_SDK_VERSION }}
      - name: Restore wasi-stub
        id: restore-wasi-stub
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/wasi-stub
          key: tools-wasi-stub-${{ env.XTASK_WASI_STUB_VERSION }}
      - name: Restore wasm-opt
        id: restore-wasm-opt
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/tools/wasm-opt
          key: tools-binaryen-${{ env.XTASK_BINARYEN_VERSION }}
      - name: Restore typst
        id: restore-typst
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/tools/typst
          key: tools-typst-${{ env.XTASK_TYPST_VERSION }}
      - name: Run CI xtask
        run: cargo xtask ci
      # Saving on failure keeps a build error from throwing away tools that were
      # already downloaded, but a cancelled run is skipped: it can interrupt an
      # unpacking tool and the keys are too coarse to notice a truncated one.
      - name: Cache WASI SDK
        if: ${{ !cancelled() && steps.restore-wasi-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/wasi_sdk
          key: tools-wasi-sdk-${{ env.XTASK_WASI_SDK_VERSION }}
      - name: Cache wasi-stub
        if: ${{ !cancelled() && steps.restore-wasi-stub.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/wasi-stub
          key: tools-wasi-stub-${{ env.XTASK_WASI_STUB_VERSION }}
      - name: Cache wasm-opt
        if: ${{ !cancelled() && steps.restore-wasm-opt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/tools/wasm-opt
          key: tools-binaryen-${{ env.XTASK_BINARYEN_VERSION }}
      - name: Cache typst
        if: ${{ !cancelled() && steps.restore-typst.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XTASK_WORK_DIR }}/tools/typst
          key: tools-typst-${{ env.XTASK_TYPST_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-wasm
          path: ./typst-package/zint_typst_plugin.wasm
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: manual
          path: ./typst-package/manual.pdf
          retention-days: 7
