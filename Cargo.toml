[workspace]
package.edition = "2021"
package.license = "MIT"
resolver = "2"
members = [
    "zint-wasm-sys",
    "zint-wasm-rs",
    "zint-typst-plugin",
    "zint-typst-plugin/vendor/wasm-minimal-protocol/crates/macro",
    "zint-typst-plugin/vendor/wasm-minimal-protocol/crates/wasi-stub",
    "xtask"
]
default-members = [
    "zint-wasm-sys",
    "zint-wasm-rs",
    "zint-typst-plugin",
]

[profile.release]
# Enable link-time optimization
lto = true
# Strip symbols from binary
strip = true

[profile.plugin-debug]
inherits = "dev"
# Abort on panic
panic = 'abort'

[profile.plugin-release]
inherits = "release"
# Optimize for size
opt-level = 'z'
# Reduce number of codegen units to increase optimizations
codegen-units = 1
# Abort on panic
panic = 'abort'
# Drop the debug info but keep the custom sections that `release` would also
# strip. wasm-opt reads the `target_features` section to learn which proposals
# the module uses; without it, it validates against its own defaults and
# rejects whatever the Rust toolchain has enabled since. wasm-opt removes the
# section itself, so the shipped plugin is unaffected.
strip = "debuginfo"

[workspace.dependencies]
walkdir = "2"
