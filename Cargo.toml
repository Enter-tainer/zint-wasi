[workspace]
package.edition = "2024"
package.license = "MIT"
resolver = "3"
members = [
    "zint-wasm-sys",
    "zint-wasm-rs",
    "zint-wasm-rs/macros",
    "zint-typst-plugin",
    "zint-typst-plugin/vendor/wasm-minimal-protocol/crates/macro",
    "zint-typst-plugin/vendor/wasm-minimal-protocol/crates/wasi-stub",
    "xtask"
]
default-members = [
    "zint-wasm-sys",
    "zint-wasm-rs",
    "zint-typst-plugin",
]

[profile.release]
# Enable link-time optimization
lto = true
# Strip symbols from binary
strip = true

[profile.plugin-debug]
inherits = "dev"
# Abort on panic
panic = 'abort'

[profile.plugin-release]
inherits = "release"
# Optimize for size
opt-level = 'z'
# Reduce number of codegen units to increase optimizations
codegen-units = 1
# Abort on panic
panic = 'abort'

[workspace.dependencies]
walkdir = "2"
