[package]
name = "zint-wasm-rs"
version = "0.3.0"
license = "MIT"
edition.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
typst = []

[dependencies]
zint-wasm-sys = { path = "../zint-wasm-sys" }

serde = { version = "1", features = ["derive"] }
hex = "0.4"

bitflags = { version = "2.4", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
# Already in the tree as the Typst plugin's option format; the deserialization
# tests use it so they exercise the same wire format the plugin receives.
ciborium = "0.2.1"
